<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arabcha A1 Daftar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* Layout: one app column (phone first). Home = unit grid; unit = tabs Soʻzlar / Kartochka / Oʻyinlar / Test / Qoidalar. Clean white, green + lilac, pastel illustration tiles. */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --soft:#eef1f6; --ink:#0f172a; --muted:#5b6478; --line:#e4e8f0;
  --accent:#0d9b74; --accent-2:#6d5dfc; --accent-ink:#ffffff; --accent-soft:#e3f6ef; --lilac:#6a55e0; --lilac-soft:#eeeaff;
  --good:#0d9b74; --good-soft:#dcf5ec; --bad:#d9485f; --bad-soft:#ffecef;
  --tile-mint:#e3f6ef; --tile-lilac:#eeeaff; --tile-peach:#ffeee4; --tile-sky:#e3f1fd;
  --grad:linear-gradient(135deg,#12c29b 0%,#0d9b74 42%,#6d5dfc 100%);
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.07);
  --shadow-lg:0 18px 40px rgba(13,90,80,.22);
  --glass:rgba(255,255,255,.78);
  --f-ui:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-ar:"Noto Naskh Arabic", "Amiri", "Geeza Pro", "Traditional Arabic", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --surface:#141b2e; --soft:#1b2438; --ink:#e8ecf5; --muted:#97a2b8; --line:#26304a;
  --accent:#2fd3a3; --accent-2:#8b7dff; --accent-ink:#06261c; --accent-soft:#12332c; --lilac:#a99cff; --lilac-soft:#241f45;
  --good:#3ddbab; --good-soft:#123528; --bad:#ff7a8e; --bad-soft:#3a1a22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 18px 40px rgba(0,0,0,.4); --glass:rgba(20,27,46,.78); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#141b2e; --soft:#1b2438; --ink:#e8ecf5; --muted:#97a2b8; --line:#26304a;
  --accent:#2fd3a3; --accent-2:#8b7dff; --accent-ink:#06261c; --accent-soft:#12332c; --lilac:#a99cff; --lilac-soft:#241f45;
  --good:#3ddbab; --good-soft:#123528; --bad:#ff7a8e; --bad-soft:#3a1a22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 18px 40px rgba(0,0,0,.4); --glass:rgba(20,27,46,.78); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.app{max-width:760px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.btn{border:0;border-radius:16px;padding:12px 18px;font-weight:700;background:var(--soft);min-height:48px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;flex:none}
.muted{color:var(--muted)}
.tile{border-radius:20px;display:grid;place-items:center;flex:none}
.t-mint{background:var(--tile-mint)}.t-lilac{background:var(--tile-lilac)}.t-peach{background:var(--tile-peach)}.t-sky{background:var(--tile-sky)}
.tile .ar{color:#4a3c94;font-weight:700}

/* home */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 0 18px}
.hero h1{font-size:clamp(24px,5vw,32px);font-weight:800;letter-spacing:-.01em}
.hero p{margin:4px 0 0;max-width:46ch}
.hero .ar{font-size:30px;color:var(--accent);line-height:1}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ucard{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:22px;padding:12px}
.ucard:hover{border-color:var(--accent)}
.ucard .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ucard .n{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ucard .t{font-weight:700;line-height:1.3}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* unit header + tabs */
.uhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.uhead .meta{flex:1;min-width:0}
.uhead h2{font-size:20px;font-weight:800;line-height:1.25}
.uhead .ar{font-size:20px;color:var(--accent)}
.tabs{display:flex;gap:2px;background:var(--soft);padding:4px;border-radius:16px;margin-bottom:18px}
.tab{flex:1 1 0;min-width:0;border:0;background:transparent;padding:10px 2px;border-radius:12px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:44px}
@media (min-width:520px){.tab{font-size:15px}}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* words */
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.wrow{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:18px;padding:8px 10px 8px 8px;background:var(--surface);min-width:0}
.wrow.known{border-color:var(--good)}
.wrow .tile{width:64px;height:64px;border-radius:14px}
.wrow .tile .ar{font-size:26px}
.wrow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.wrow .tx .ar{font-size:24px;line-height:1.6;text-align:right}
.wrow .tx .uz{font-weight:600}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--lilac-soft);color:var(--lilac);font-weight:600;margin-top:2px;align-self:flex-start}
.hide .wrow .uz{filter:blur(6px)}
.hide .wrow:hover .uz,.hide .wrow:focus-within .uz{filter:none}
.say{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--accent);flex:none}

/* flashcard */
.progress{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:700;color:var(--muted);font-size:14px}
.progress .bar{flex:1;height:10px}
.card{border:1.5px solid var(--line);border-radius:28px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);max-width:520px;margin:0 auto}
.card .art{width:100%;height:240px;border-radius:22px}
.card .art .ar{font-size:110px;line-height:1}
.card .word{font-size:clamp(36px,9vw,48px);font-weight:700;line-height:1.55;text-align:center}
.card .uz{font-size:24px;font-weight:800;text-align:center}
.card .reveal{border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:10px 16px;font-weight:700;color:var(--muted);min-height:48px}
.cardbar{display:flex;gap:10px;max-width:520px;margin:14px auto 0}
.cardbar .btn{flex:1}

/* games */
.gmenu{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gcard{display:flex;gap:14px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:22px;padding:14px}
.gcard:hover{border-color:var(--accent)}
.gcard .tile{width:64px;height:64px;border-radius:16px}
.gcard b{display:block;font-size:17px}
.gcard span{color:var(--muted);font-size:14px}
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ghead h3{flex:1;font-size:19px;font-weight:800}
.stat{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:520px;margin:0 auto}
.mcard{aspect-ratio:1/1;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:6px;min-width:0}
.mcard.back{background:var(--accent-soft);border-color:transparent}
.mcard.back svg{opacity:.55}
.mcard.open{border-color:var(--lilac);border-width:2.5px}
.mcard.done{background:var(--good-soft);border-color:var(--good)}
.mcard .ar{font-size:clamp(17px,4.6vw,24px);font-weight:700;line-height:1.4;text-align:center;word-break:break-word}
.mcard .uzs{font-size:12px;font-weight:600;color:var(--muted);text-align:center;line-height:1.2}
.picq{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.picq .art{height:250px;border-radius:26px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:18px;min-height:64px;padding:8px 10px;font-weight:700}
.opt.ar{font-size:24px;line-height:1.4}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{min-height:24px;font-weight:700;text-align:center}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.slots{display:flex;flex-direction:row-reverse;justify-content:center;gap:8px;flex-wrap:wrap}
.slot{width:52px;height:60px;border-bottom:3px solid var(--line);display:grid;place-items:center;font-family:var(--f-ar);font-size:32px;background:transparent;border-top:0;border-left:0;border-right:0;border-radius:0}
.slot.filled{border-color:var(--accent)}
.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.letter{width:58px;height:58px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-ar);font-size:30px;box-shadow:0 3px 0 var(--line)}
.letter:disabled{opacity:.25;box-shadow:none}
.assembled{text-align:center;font-size:40px;font-weight:700;min-height:64px;line-height:1.6}
.ring{display:grid;place-items:center}
.tf{border-radius:28px;background:var(--lilac-soft);padding:22px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;max-width:520px;margin:0 auto}
.tf .ar{font-size:44px;font-weight:700;line-height:1.5}
.tf .uz{font-size:24px;font-weight:800}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin:14px auto 0}
.tfbtns .btn{min-height:72px;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px}
.sentence{min-height:76px;border:1.5px dashed var(--line);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;direction:rtl;align-items:center;justify-content:flex-start}
.sentence.ok{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.sentence.no{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.wchip{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 12px;font-family:var(--f-ar);font-size:24px;line-height:1.5;box-shadow:0 3px 0 var(--line)}
.wchip:disabled{opacity:.25;box-shadow:none}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:rtl}
.result{text-align:center;max-width:460px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.result .big{font-size:48px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.stars{display:flex;gap:6px}
.mist{width:100%;display:grid;gap:6px;text-align:left}
.mist div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:4px 0}
.mist .ar{font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* quiz + rules */
.q{border:1.5px solid var(--line);border-radius:24px;padding:18px;max-width:560px;margin:0 auto}
.q .prompt{color:var(--muted);font-size:14px;font-weight:600}
.q .qbig{font-size:34px;line-height:1.6;text-align:center;margin:6px 0 12px;font-weight:700}
.q .quz{font-size:22px;font-weight:800;text-align:center;margin:8px 0 14px}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
.rule{border:1.5px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px}
.rule-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 14px;margin-bottom:8px}
.rule-h h3{font-size:18px;font-weight:800}
.rule-h .ar{font-size:21px;color:var(--lilac)}
.rule p{margin:6px 0;max-width:68ch}
.tbl{overflow-x:auto;margin:10px 0}
.tbl table{border-collapse:collapse;min-width:100%;font-size:14px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.tbl th{background:var(--soft);font-weight:700}
.tbl td.ar{font-size:20px;line-height:1.6}
.ex{display:grid;gap:4px;margin:10px 0}
.ex div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px;padding:6px 12px;border-radius:12px;background:var(--soft)}
.ex .ar{font-size:20px;line-height:1.7}
.ex .uz{color:var(--muted);font-size:14px}
.note{background:var(--lilac-soft);padding:10px 14px;border-radius:14px;margin:10px 0;font-size:14.5px}
.note b{color:var(--lilac)}
.mini{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.mini h4{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mq{margin-bottom:12px}
.mq .qt{margin-bottom:6px;font-weight:600}
.mq .qt .ar{font-size:20px;font-weight:500}
.mq .opts{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.mq .opt{min-height:52px}
.mq .why{font-size:13.5px;color:var(--muted);margin-top:4px}
footer{margin-top:28px;color:var(--muted);font-size:13px;max-width:68ch}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
@media (prefers-reduced-motion: reduce){.shake{animation:none}}

/* ---- modern layer ---- */
.typeform{display:flex;gap:8px;width:100%;margin-top:6px}
.typein{flex:1;min-width:0;border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:16px;padding:12px 14px;font:inherit;font-size:17px;font-weight:600;min-height:52px}
.typein.ar{font-family:var(--f-ar);font-size:22px}
.typein:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.card .fb{min-height:24px;margin-top:4px}
.card .row{margin-top:2px}
.namebox{background:var(--surface);border-radius:22px;padding:14px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.namebox label{display:flex;flex-direction:column;gap:2px}
.week{background:var(--surface);border-radius:22px;padding:14px;box-shadow:var(--shadow);margin-bottom:22px}
.wbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.wb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.wb .col{height:70px;width:100%;max-width:28px;background:var(--soft);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wb .col i{display:block;width:100%;background:var(--grad);border-radius:8px}
.wb.today span{color:var(--accent)}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1;display:inline-block;filter:drop-shadow(0 6px 8px rgba(15,23,42,.18));position:relative}
.utile .letterart{color:#3b2f8a;font-weight:700;position:relative}
.wrow .utile{width:64px;height:64px;border-radius:18px}
.card .utile.art{width:100%;height:240px;border-radius:24px}
.picq .utile.art{width:100%;height:240px;border-radius:26px}
.bubq{text-align:center;display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.bubq b{font-size:26px;font-weight:800}
.sky{position:relative;height:min(62vh,460px);border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#e0f2fe 0%,#ede9fe 100%)}
.bub{position:absolute;bottom:-110px;width:22%;aspect-ratio:1/1;border-radius:50%;border:0;display:grid;place-items:center;padding:6px;color:#0f172a;
 background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 10%,rgba(255,255,255,.35) 11% 30%,transparent 31%),radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--bc) 35%,white) 0,color-mix(in srgb,var(--bc) 70%,white) 70%,var(--bc) 100%);
 box-shadow:inset 0 -6px 14px rgba(0,0,0,.12),0 10px 20px rgba(15,23,42,.15);animation:rise-b var(--d) linear var(--w) forwards}
.bub .ar{font-size:clamp(15px,4.4vw,22px);font-weight:700;line-height:1.3;word-break:break-word}
.bub.pop{animation:popb .35s ease forwards}
.bub.bad{opacity:.35;filter:grayscale(1)}
@keyframes rise-b{to{transform:translateY(calc(-1 * min(62vh,460px) - 130px))}}
@keyframes popb{to{transform:scale(1.5);opacity:0}}
.ladder{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.ladder span{flex:none;font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.ladder span.safe{box-shadow:inset 0 0 0 1.5px #f59e0b}
.ladder span.past{background:var(--accent-soft);color:var(--accent)}
.ladder span.now{background:linear-gradient(135deg,#facc15,#f59e0b);color:#3b2400}
.q.mil{background:linear-gradient(180deg,var(--surface),var(--surface)) padding-box}
.opt .lt{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--soft);font-family:var(--f-ui);font-size:12px;font-weight:800;color:var(--muted);margin-inline-end:6px;vertical-align:middle}
@media (prefers-reduced-motion: reduce){.bub{animation-duration:calc(var(--d) * 1.6)}}
.app{padding-bottom:calc(110px + env(safe-area-inset-bottom, 0px))}
.app.home{padding-bottom:48px}
.btn{transition:transform .12s ease, box-shadow .2s ease}
.btn:active,.ucard:active,.gcard:active,.opt:active,.mcard:active,.letter:active,.wchip:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(13,155,116,.28)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.iconbtn{background:var(--surface);box-shadow:var(--shadow)}
.hello{position:relative;overflow:hidden;border-radius:28px;padding:22px;color:#fff;background:var(--grad);box-shadow:var(--shadow-lg);display:flex;gap:18px;align-items:center;margin:4px 0 22px}
.hello::before,.hello::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;pointer-events:none}
.hello::before{width:220px;height:220px;background:#7ff0d0;left:-60px;top:-80px}
.hello::after{width:240px;height:240px;background:#c4b5fd;right:-70px;bottom:-110px}
.hello>*{position:relative}
.hello .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hello .hi{font-size:14px;font-weight:600;opacity:.9}
.hello h1{font-size:clamp(24px,6vw,30px);font-weight:800;line-height:1.15;color:#fff}
.hello .go{align-self:flex-start;margin-top:8px;border:0;border-radius:14px;padding:11px 16px;font-weight:800;background:rgba(255,255,255,.95);color:#0b6e54;min-height:44px;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.hello .ring{flex:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:22px}
.stat2{background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat2 b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat2 span{font-size:12.5px;color:var(--muted);font-weight:600}
.h2row{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px}
.h2row h2{font-size:19px;font-weight:800}
.ucard{border:0;box-shadow:var(--shadow);border-radius:24px;padding:12px;transition:transform .15s ease, box-shadow .2s ease}
.ucard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.utile{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;flex:none;background:#fff;position:relative;overflow:hidden}
.utile::before{content:"";position:absolute;inset:0;background:var(--g);opacity:.28}
.utile svg{position:relative}
.ucard .bar i,.progress .bar i,.ubanner .bar i{background:var(--grad)}
.ucard .n{color:var(--c,var(--muted))}
.ubanner{position:relative;overflow:hidden;border-radius:26px;padding:16px 16px 18px;background:var(--g);color:#fff;box-shadow:var(--shadow-lg);margin-bottom:18px}
.ubanner::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.25);filter:blur(30px);right:-60px;top:-80px}
.ubanner>*{position:relative}
.ubanner .top{display:flex;align-items:center;gap:12px}
.ubanner .iconbtn{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.ubanner .meta{flex:1;min-width:0}
.ubanner .n{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.ubanner h2{font-size:21px;font-weight:800;color:#fff;line-height:1.2}
.ubanner .ar{font-size:24px;color:#fff;opacity:.95;margin-top:10px;display:block}
.ubanner .bar{background:rgba(255,255,255,.3);margin-top:10px}
.ubanner .bar i{background:#fff}
.ubanner small{display:block;margin-top:6px;font-weight:600;opacity:.9}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));pointer-events:none}
.dock nav{pointer-events:auto;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px;border-radius:24px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--line);box-shadow:0 10px 30px rgba(15,23,42,.15)}
.dock button{border:0;background:transparent;border-radius:18px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);min-height:54px;min-width:0}
.dock button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dock button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.wrow,.card,.gcard,.q,.rule,.mcard,.opt,.letter,.wchip,.stat2{border-color:transparent}
.wrow{box-shadow:var(--shadow);border-radius:20px}
.wrow.known{box-shadow:var(--shadow), inset 0 0 0 2px var(--good)}
.card{box-shadow:var(--shadow);border-radius:30px}
.gcard{box-shadow:var(--shadow);border-radius:24px;transition:transform .15s ease}
.gcard:hover{transform:translateY(-2px)}
.gcard .gt{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;flex:none;background:var(--g);box-shadow:0 8px 18px rgba(0,0,0,.12)}
.q,.rule{box-shadow:var(--shadow);background:var(--surface)}
.opt{box-shadow:var(--shadow);border:2px solid transparent}
.opt.ok{border-color:var(--good)}.opt.no{border-color:var(--bad)}
.mcard{box-shadow:var(--shadow);border:2px solid transparent}
.mcard.back{background:var(--grad);box-shadow:0 6px 16px rgba(13,155,116,.25)}
.mcard.back svg{opacity:.9;color:#fff}
.mcard.back svg path{stroke:#fff}
.letter,.wchip{box-shadow:var(--shadow), 0 3px 0 var(--line)}
.tf{background:linear-gradient(135deg,var(--lilac-soft),var(--accent-soft))}
.tabs{display:none}
.result .big{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.stars svg{animation:pop .45s ease both}.stars svg:nth-child(2){animation-delay:.12s}.stars svg:nth-child(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#panel>*,.units>*,.hello,.stats{animation:rise .3s ease both}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion: reduce){#panel>*,.units>*,.hello,.stats,.stars svg{animation:none}.confetti{display:none}.btn,.ucard,.gcard{transition:none}}

/* speech (optional) */
let arVoice=null;
function pickVoice(){try{arVoice=speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang))||null}catch(e){arVoice=null}}
if("speechSynthesis" in window){pickVoice();try{speechSynthesis.onvoiceschanged=()=>{const had=!!arVoice;pickVoice();if(!had&&arVoice)render();}}catch(e){}}
function say(t){if(!arVoice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/×/g,"،"));u.voice=arVoice;u.lang=arVoice.lang;u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
const sayBtn=ar=>arVoice?'<button class="say" data-say="'+esc(ar)+'" aria-label="Tinglash">'+ICO.sound+'</button>':'';

const REPORT_URL=""; /* Google Apps Script manzili shu yerga qoʻyiladi */
function reportUrl(){try{const q=new URLSearchParams(location.search).get("r");if(q)return "https://script.google.com/macros/s/"+q+"/exec";}catch(e){}return REPORT_URL;}
function tgUser(){try{const u=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user;if(u&&u.id)return u;}catch(e){}return null;}
function student(){const u=tgUser();if(u)return {id:"tg"+u.id,name:[u.first_name,u.last_name].filter(Boolean).join(" "),username:u.username||""};
  let id=store.get("a1.sid",null);if(!id){id="w"+Math.random().toString(36).slice(2,10);store.set("a1.sid",id);}return {id,name:store.get("a1.name",""),username:""};}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function logAct(n){const L=store.get("a1.days",{});const t=today();L[t]=(L[t]||0)+(n||1);store.set("a1.days",L);}
function streak(){const L=store.get("a1.days",{});let c=0;const d=new Date();if(!L[today()])d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(L[k]){c++;d.setDate(d.getDate()-1);}else break;}return c;}
function unitSummary(){return UNITS.map(u=>{const k=known(u.n);return u.n+":"+itemsOf(u).filter(x=>k[x.ar]).length+"/"+itemsOf(u).length}).join(" ");}
let lastSync=0;
function report(kind,detail,score,total,force){const url=reportUrl();if(!url)return;const now=Date.now();if(!force&&now-lastSync<60000)return;lastSync=now;
  const st=student();const kn=UNITS.reduce((a,u)=>{const k=known(u.n);return a+itemsOf(u).filter(x=>k[x.ar]).length},0);
  const body={id:st.id,name:st.name||"(ismsiz)",username:st.username,kind,detail,unit:S.unit,score:score??"",total:total??"",known:kn,all:ALL.length,units:unitSummary(),streak:streak(),tests:JSON.stringify(store.get("a1.tests",{})),time:new Date().toISOString()};
  try{fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).catch(()=>{});}catch(e){}}

  const mx=Math.max(10,...days.map(x=>x.v));const T=store.get("a1.tests",{});const tk=Object.keys(T);const avg=tk.length?Math.round(tk.reduce((a,k)=>a+T[k],0)/tk.length):null;

let fc={unit:0,deck:[],i:0,onlyNew:true,dir:"uz",tries:0,state:null,hint:0};
function buildDeck(){const u=U(),k=known(u.n);let d=itemsOf(u);if(fc.onlyNew)d=d.filter(x=>!k[x.ar]);fc={...fc,unit:u.n,deck:shuffle(d),i:0,tries:0,state:null,hint:0};}
const normUz=t=>String(t).toLowerCase().replace(/[ʻʼ’‘`´']/g,"'").replace(/o'/g,"o").replace(/g'/g,"g").replace(/\([^)]*\)/g," ").replace(/…|\.\.\./g," ").replace(/[^a-zЀ-ӿ\s]/g," ").replace(/\s+/g," ").trim();
const normAr=t=>strip(t).replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[^ء-ي\s]/g,"").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function answers(c){if(fc.dir==="ar")return [normAr(c.ar)];const full=normUz(c.uz);const parts=c.uz.replace(/\([^)]*\)/g,"").split(/[,;/×]/).map(normUz).filter(x=>x.length>1);return [...new Set([full,...parts])];}
function checkTyped(c,typed){const t=fc.dir==="ar"?normAr(typed):normUz(typed);if(!t)return null;
  for(const a of answers(c)){if(t===a)return "ok";const tol=a.length>=8?2:a.length>=4?1:0;if(lev(t,a)<=tol)return "near";}return "no";}
function renderCards(){
  if(fc.unit!==S.unit)buildDeck();
  const u=U(),k=known(u.n),all=itemsOf(u),kc=all.filter(x=>k[x.ar]).length;
  const tools='<div class="tools"><select id="fcdir" aria-label="Yozish yoʻnalishi"><option value="uz"'+(fc.dir==="uz"?' selected':'')+'>Tarjimasini yozaman</option><option value="ar"'+(fc.dir==="ar"?' selected':'')+'>Arabchasini yozaman</option></select><button class="btn ghost" data-act="onlynew" aria-pressed="'+fc.onlyNew+'">'+(fc.onlyNew?'Hammasini takrorlash':'Faqat yodlanmaganlar')+'</button></div>';
  if(!fc.deck.length){$("#panel").innerHTML=tools+'<div class="result">'+stars(3)+'<div class="big">'+kc+' / '+all.length+'</div><p>Barakalla! Bu boʻlimdagi hamma soʻzni yozib, yodladingiz.</p><button class="btn primary" data-act="resetknown">Qaytadan boshlash</button></div>';bindFc();if(kc===all.length)report("boʻlim tugadi",u.uz,kc,all.length,true);return;}
  const c=fc.deck[fc.i];const pc=Math.round(kc/all.length*100);
  const hintTxt=fc.hint?(fc.dir==="ar"?strip(c.ar).slice(0,fc.hint+1)+"…":c.uz.slice(0,fc.hint*2+1)+"…"):"";
  const st=fc.state;
  $("#panel").innerHTML=tools+'<div class="progress"><div class="bar"><i style="width:'+pc+'%"></i></div><span>'+kc+'/'+all.length+'</span></div>'+
   '<div class="card'+(st==="no"?' shake':'')+'">'+tileFor(c,150,'art')+
   (fc.dir==="uz"?'<div class="word ar">'+c.ar+'</div>':'<div class="uz" style="font-size:26px">'+esc(c.uz)+'</div>')+
   (arVoice&&fc.dir==="uz"?'<button class="btn ghost" style="min-height:40px;padding:6px 12px" data-say="'+esc(c.ar)+'">'+ICO.sound+'</button>':'')+
   (st==="ok"||st==="near"?'<div class="fb good">'+(st==="near"?'Deyarli toʻgʻri! ':'Toʻgʻri! ')+'<span class="'+(fc.dir==="ar"?'ar':'')+'">'+(fc.dir==="ar"?c.ar:esc(c.uz))+'</span></div>':
    st==="show"?'<div class="fb bad">Javob: <span class="'+(fc.dir==="ar"?'ar':'')+'">'+(fc.dir==="ar"?c.ar:esc(c.uz))+'</span></div><button class="btn primary" data-act="fcnext">Keyingisi</button>':
    '<form class="typeform" id="fcform" autocomplete="off"><input id="fcin" class="typein'+(fc.dir==="ar"?' ar':'')+'" placeholder="'+(fc.dir==="ar"?'Arabcha yozing…':'Tarjimasini yozing…')+'" aria-label="Javob" '+(fc.dir==="ar"?'dir="rtl" lang="ar"':'')+' enterkeyhint="done"><button class="btn primary" type="submit">Tekshirish</button></form>'+
    '<div class="fb '+(st==="no"?'bad':'')+'">'+(st==="no"?'Notoʻgʻri, yana urinib koʻring ('+(3-fc.tries)+' ta imkoniyat)':(hintTxt?'Yordam: <span class="'+(fc.dir==="ar"?'ar':'')+'">'+esc(hintTxt)+'</span>':'&nbsp;'))+'</div>'+
    '<div class="row"><button class="btn ghost" data-act="fchint">Yordam</button><button class="btn ghost" data-act="fcshow">Bilmayman</button></div>')+
   '</div><p class="muted" style="text-align:center;font-size:13px;margin-top:10px">Bu davrada qoldi: '+(fc.deck.length-fc.i)+' ta soʻz</p>';
  bindFc();const inp=$("#fcin");if(inp){try{inp.focus({preventScroll:true})}catch(e){}}
}
function bindFc(){const d=$("#fcdir");if(d)d.onchange=e=>{fc.dir=e.target.value;fc.tries=0;fc.state=null;fc.hint=0;renderCards();};
  const f=$("#fcform");if(f)f.onsubmit=e=>{e.preventDefault();fcCheck($("#fcin").value);};}
function fcCheck(v){const c=fc.deck[fc.i];const r=checkTyped(c,v);if(!r)return;logAct();
  if(r==="ok"||r==="near"){fc.state=r;const k=known(S.unit);if(!fc.tries&&!fc.hint)k[c.ar]=1;store.set("a1.known."+S.unit,k);renderCards();report("kartochka",U().uz,null,null,false);setTimeout(()=>{if(fc.deck[fc.i]===c&&(fc.state==="ok"||fc.state==="near"))fcNext(!fc.tries&&!fc.hint);},900);}
  else{fc.tries++;if(fc.tries>=3){fc.state="show";}else fc.state="no";renderCards();}}
function fcNext(learned){const c=fc.deck[fc.i];
  if(learned&&fc.onlyNew){fc.deck.splice(fc.i,1);}else{fc.deck.splice(fc.i,1);fc.deck.push(c);if(fc.deck.length===1)fc.i=0;}
  if(fc.i>=fc.deck.length)fc.i=0;fc.tries=0;fc.state=null;fc.hint=0;renderCards();}

/* ---------------- games ---------------- */
const GAMES=[
 ["match","Juftini top","Rasm yoki tarjimani arabcha soʻz bilan juftlang","🧩"],
 ["pic","Rasmni top","Rasmga qarab toʻgʻri soʻzni tanlang","🖼️"],
 ["bubble","Pufakchalar","Uchib ketayotgan toʻgʻri soʻzni ushlab qoling","🫧"],
 ["million","Million soʻm","Savollarga javob berib, million soʻmgacha yuting","💰"],
 ["letters","Harflardan yigʻ","Soʻzni harflardan tering va yozishni mashq qiling","🔤"],
 ["speed","60 soniya","Bir daqiqada tarjima toʻgʻri yoki notoʻgʻri ekanini toping","⚡"],
 ["order","Gapni tartibla","Aralash soʻzlardan toʻgʻri gap tuzing","🧱"]
];
const GAME_GRAD={match:"linear-gradient(135deg,#a78bfa,#7c3aed)",pic:"linear-gradient(135deg,#34d399,#059669)",letters:"linear-gradient(135deg,#fbbf24,#f97316)",speed:"linear-gradient(135deg,#38bdf8,#6366f1)",order:"linear-gradient(135deg,#f472b6,#db2777)",bubble:"linear-gradient(135deg,#22d3ee,#0891b2)",million:"linear-gradient(135deg,#facc15,#f59e0b)"};
function renderGames(){
  if(!S.game){
    $("#panel").innerHTML='<div class="gmenu">'+GAMES.map(g=>'<button class="gcard" data-game="'+g[0]+'"><div class="gt" style="--g:'+GAME_GRAD[g[0]]+'"><span class="emo" style="font-size:34px">'+g[3]+'</span></div><div><b>'+g[1]+'</b><span>'+g[2]+'</span>'+(store.get("a1.best."+g[0]+"."+S.unit,null)!==null?'<span style="display:block;color:var(--accent);font-weight:700;font-size:13px">Rekord: '+store.get("a1.best."+g[0]+"."+S.unit,0)+'</span>':'')+'</div></button>').join("")+'</div>';
    return;}
  ({match:gMatch,pic:gPic,letters:gLetters,speed:gSpeed,order:gOrder,bubble:gBubble,million:gMillion})[S.game.type]();
}
function gHead(title,stat){return '<div class="ghead"><button class="iconbtn" data-act="gamesmenu" aria-label="Oʻyinlar roʻyxatiga qaytish">'+ICO.back+'</button><h3>'+title+'</h3><span class="stat" id="gstat">'+(stat||"")+'</span></div>';}
function saveBest(type,score,lowerBetter){logAct(3);report("oʻyin: "+((GAMES.find(g=>g[0]===type)||[0,type])[1]),U().uz,score,null,true);const k="a1.best."+type+"."+S.unit,b=store.get(k,null);if(b===null||(lowerBetter?score<b:score>b)){store.set(k,score);return true}return false;}
function endScreen(title,big,sub,n,extra){if(n>=2)setTimeout(confetti,50);return '<div class="result">'+stars(n)+'<div class="big">'+big+'</div><b style="font-size:18px">'+title+'</b><p class="muted" style="margin:0">'+sub+'</p>'+(extra||"")+'<div class="row"><button class="btn ghost" data-act="gamesmenu">Boshqa oʻyin</button><button class="btn primary" data-act="replay">Yana oʻynash</button></div></div>';}
function poolFor(fn,min){let p=itemsOf(U()).filter(fn);if(p.length<min){const extra=ALL.filter(x=>x.u!==S.unit&&fn(x));p=p.concat(shuffle(extra).slice(0,min*2-p.length));}return p;}
const withIcon=x=>!!emoOf(x.ar);

/* Juftini top */
function startMatch(){const pool=shuffle(itemsOf(U())).slice(0,6);const cards=[];
  pool.forEach((it,i)=>{cards.push({p:i,face:"ar",it});cards.push({p:i,face:withIcon(it)?"pic":"uz",it});});
  S.game={type:"match",cards:shuffle(cards),open:[],done:new Set(),moves:0,t0:Date.now(),lock:false};}
function gMatch(){const g=S.game;
  if(g.done.size===6){const sec=Math.round((Date.now()-g.t0)/1000),n=g.moves<=8?3:g.moves<=12?2:1,rec=saveBest("match",g.moves,true);
    $("#panel").innerHTML=gHead("Juftini top")+endScreen("Hamma juftlar topildi!",g.moves+" urinish",sec+" soniyada"+(rec?" · yangi rekord":""),n);return;}
  $("#panel").innerHTML=gHead("Juftini top",'Urinish: '+g.moves+' · '+g.done.size+'/6')+'<p class="muted" style="margin:0 0 12px;text-align:center">Ikkita kartochkani oching: rasm yoki tarjimani arabcha soʻz bilan juftlang.</p><div class="mgrid">'+
   g.cards.map((c,i)=>{const up=g.open.includes(i)||g.done.has(c.p);let inner;
     if(!up)inner=ICO.dots;else if(c.face==="ar")inner='<span class="ar">'+c.it.ar+'</span>';else if(c.face==="pic")inner='<div style="display:flex;flex-direction:column;align-items:center;gap:2px">'+emoSpan(emoOf(c.it.ar),44)+'<span class="uzs">'+esc(c.it.uz)+'</span></div>';else inner='<span style="font-weight:700;text-align:center;font-size:14px">'+esc(c.it.uz)+'</span>';
     return '<button class="mcard'+(up?(g.done.has(c.p)?' done':' open'):' back')+'" data-m="'+i+'" aria-label="'+(up?'Ochiq kartochka':'Yopiq kartochka')+'">'+inner+'</button>';}).join("")+'</div>';
}
function matchClick(i){const g=S.game,c=g.cards[i];if(g.lock||g.open.includes(i)||g.done.has(c.p))return;g.open.push(i);
  if(g.open.length===2){g.moves++;const[a,b]=g.open.map(x=>g.cards[x]);if(a.p===b.p){g.done.add(a.p);g.open=[];gMatch();}else{g.lock=true;gMatch();setTimeout(()=>{if(S.game!==g)return;g.open=[];g.lock=false;gMatch();},900);}}
  else gMatch();}

/* Rasmni top */
function startPic(){const pool=poolFor(withIcon,4);const qs=shuffle(pool).slice(0,Math.min(8,pool.length)).map(it=>({it,opts:shuffle([it,...shuffle(pool.filter(x=>x.ar!==it.ar&&emoOf(x.ar)!==emoOf(it.ar))).slice(0,3)])}));
  S.game={type:"pic",qs,i:0,score:0,ans:null,wrong:[]};}
function gPic(){const g=S.game;
  if(g.i>=g.qs.length){const n=g.qs.length,p=g.score/n,rec=saveBest("pic",g.score);$("#panel").innerHTML=gHead("Rasmni top")+endScreen(p===1?"Aʼlo!":"Yaxshi!",g.score+" / "+n,"toʻgʻri javob"+(rec?" · yangi rekord":""),p===1?3:p>=.7?2:1,mist(g.wrong));return;}
  const q=g.qs[g.i];
  $("#panel").innerHTML=gHead("Rasmni top",(g.i+1)+' / '+g.qs.length+' · '+g.score+' ✓')+'<div class="picq">'+tileFor(q.it,180,'art')+
   '<div class="opts">'+q.opts.map((o,k)=>{let cl="";if(g.ans!==null){if(o.ar===q.it.ar)cl=" ok";else if(k===g.ans)cl=" no";}return '<button class="opt ar'+cl+'" data-pic="'+k+'"'+(g.ans!==null?' disabled':'')+'>'+o.ar+'</button>';}).join("")+'</div>'+
   '<div class="fb '+(g.ans===null?'':q.opts[g.ans].ar===q.it.ar?'good':'bad')+'">'+(g.ans===null?'Bu nima? Arabchasini tanlang.':(q.opts[g.ans].ar===q.it.ar?'Toʻgʻri! ':'Toʻgʻri javob: ')+'<span class="ar">'+q.it.ar+'</span> — '+esc(q.it.uz))+'</div>'+
   (g.ans!==null?'<button class="btn primary" data-act="picnext">Keyingisi</button>':'')+'</div>';}
function mist(w){return w.length?'<div class="mist"><b>Takrorlash uchun:</b>'+w.map(x=>'<div><span class="ar">'+x.ar+'</span><span>'+esc(x.uz)+'</span></div>').join("")+'</div>':'';}

/* Harflardan yigʻ */
const AB="ابتثجحخدذرزسشصضطظعغفقكلمنهوي";
function okLetters(x){const s=strip(x.ar);return !/[\s×]/.test(s)&&s.length>=3&&s.length<=7;}
function startLetters(){const pool=poolFor(okLetters,6);S.game={type:"letters",qs:shuffle(pool).slice(0,Math.min(8,pool.length)),i:0,score:0,pick:[],state:null,wrong:[]};prepLetters();}
function prepLetters(){const g=S.game;if(g.i>=g.qs.length)return;const w=strip(g.qs[g.i].ar),L=Array.from(w);const extra=shuffle(Array.from(AB).filter(c=>!L.includes(c))).slice(0,2);g.tiles=shuffle(L.concat(extra));g.pick=[];g.state=null;}
function gLetters(){const g=S.game;
  if(g.i>=g.qs.length){const n=g.qs.length,p=g.score/n,rec=saveBest("letters",g.score);$("#panel").innerHTML=gHead("Harflardan yigʻ")+endScreen(p===1?"Aʼlo!":"Barakalla!",g.score+" / "+n,"soʻz toʻgʻri yozildi"+(rec?" · yangi rekord":""),p===1?3:p>=.7?2:1,mist(g.wrong));return;}
  const it=g.qs[g.i],w=Array.from(strip(it.ar)),typed=g.pick.map(k=>g.tiles[k]).join("");
  $("#panel").innerHTML=gHead("Harflardan yigʻ",(g.i+1)+' / '+g.qs.length+' · '+g.score+' ✓')+'<div class="picq">'+
   '<div style="display:flex;align-items:center;gap:14px">'+tileFor(it,56,'')+'<div><div class="muted" style="font-size:14px">Shu soʻzni arabcha yozing:</div><div style="font-size:24px;font-weight:800">'+esc(it.uz)+'</div></div></div>'+
   '<div class="slots'+(g.state==="no"?' shake':'')+'">'+w.map((_,k)=>'<button class="slot'+(g.pick[k]!==undefined?' filled':'')+'" data-slot="'+k+'" aria-label="'+(k+1)+'-harf">'+(g.pick[k]!==undefined?g.tiles[g.pick[k]]:'')+'</button>').join("")+'</div>'+
   '<div class="assembled ar">'+(typed||'&nbsp;')+'</div>'+
   (g.state?'<div class="fb '+(g.state==="ok"?'good':'bad')+'">'+(g.state==="ok"?'Toʻgʻri! ':'Toʻgʻri yozilishi: ')+'<span class="ar">'+it.ar+'</span></div><button class="btn primary" data-act="letnext">Keyingisi</button>':
   '<div class="letters">'+g.tiles.map((c,k)=>'<button class="letter" data-tile="'+k+'"'+(g.pick.includes(k)?' disabled':'')+'>'+c+'</button>').join("")+'</div><div class="row"><button class="btn ghost" data-act="letundo">Oʻchirish</button><button class="btn ghost" data-act="letskip">Bilmayman</button></div>')+'</div>';}
function letterTap(k){const g=S.game,w=Array.from(strip(g.qs[g.i].ar));if(g.state||g.pick.includes(k))return;g.pick.push(k);
  if(g.pick.length===w.length){const typed=g.pick.map(x=>g.tiles[x]).join("");if(typed===w.join("")){g.state="ok";g.score++;}else{g.state="no";g.wrong.push(g.qs[g.i]);}}gLetters();}

/* 60 soniya */
function startSpeed(){S.game={type:"speed",phase:"ready",ok:0,bad:0,left:60,cur:null,wrong:[]};}
function nextSpeed(){const g=S.game,pool=itemsOf(U()),it=pool[Math.floor(Math.random()*pool.length)],truth=Math.random()<.5;let shown=it.uz;
  if(!truth){const o=shuffle(pool.filter(x=>x.uz!==it.uz))[0];shown=o.uz;}g.cur={it,shown,truth};}
function ring(left){const C=2*Math.PI*64,len=C*left/60;return '<div class="ring"><svg width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="'+left+' soniya qoldi"><circle cx="75" cy="75" r="64" fill="none" stroke="var(--soft)" stroke-width="12"/><circle cx="75" cy="75" r="64" fill="none" stroke="var(--lilac)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+len.toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 75 75)"/><text x="75" y="84" text-anchor="middle" font-size="34" font-weight="800" fill="var(--ink)" font-family="Plus Jakarta Sans, sans-serif">'+left+'</text></svg></div>';}
function gSpeed(){const g=S.game;
  if(g.phase==="ready"){const b=store.get("a1.best.speed."+S.unit,null);$("#panel").innerHTML=gHead("60 soniya")+'<div class="result">'+ring(60)+'<p style="max-width:36ch;margin:0">Arabcha soʻz va tarjima chiqadi. Tarjima toʻgʻri boʻlsa «Toʻgʻri», notoʻgʻri boʻlsa «Notoʻgʻri» tugmasini bosing. Xato uchun ball ayirilmaydi.</p>'+(b!==null?'<p class="muted" style="margin:0">Rekordingiz: '+b+' ta</p>':'')+'<button class="btn primary" data-act="speedgo">Boshlash</button></div>';return;}
  if(g.phase==="end"){const rec=saveBest("speed",g.ok);$("#panel").innerHTML=gHead("60 soniya")+endScreen("Vaqt tugadi!",g.ok+" ta","toʻgʻri javob, "+g.bad+" ta xato"+(rec?" · yangi rekord":""),g.ok>=20?3:g.ok>=12?2:1,mist(g.wrong));return;}
  const c=g.cur;
  $("#panel").innerHTML=gHead("60 soniya",'<span style="color:var(--good)">'+g.ok+' ✓</span> · <span style="color:var(--bad)">'+g.bad+' ✗</span>')+ring(g.left)+
   '<div class="tf" style="margin-top:10px"><div class="muted" style="font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lilac)">Toʻgʻrimi?</div><div class="ar">'+c.it.ar+'</div><div class="uz">'+esc(c.shown)+'</div></div>'+
   '<div class="tfbtns"><button class="btn bad" data-tf="0">'+ICO.cross+' Notoʻgʻri</button><button class="btn primary" data-tf="1">'+ICO.check+' Toʻgʻri</button></div>';}
function speedGo(){const g=S.game;g.phase="run";g.left=60;nextSpeed();stopTimer();timer=setInterval(()=>{if(!S.game||S.game!==g){stopTimer();return}g.left--;if(g.left<=0){stopTimer();g.phase="end";}if(S.tab==="games")gSpeed();},1000);gSpeed();}
function speedAns(v){const g=S.game;if(g.phase!=="run")return;if((v===1)===g.cur.truth)g.ok++;else{g.bad++;g.wrong.push(g.cur.it);}nextSpeed();gSpeed();}

/* Gapni tartibla */
function startOrder(){const own=SENT[S.unit]||[],prev=shuffle(Object.keys(SENT).filter(k=>+k<S.unit).flatMap(k=>SENT[k])).slice(0,2);
  S.game={type:"order",qs:shuffle(own).concat(prev),i:0,score:0,pick:[],state:null,wrong:[]};prepOrder();}
function prepOrder(){const g=S.game;if(g.i>=g.qs.length)return;const w=g.qs[g.i][0].split(" ");let t=shuffle(w);let guard=0;while(t.join(" ")===w.join(" ")&&guard++<10)t=shuffle(w);g.chips=t;g.pick=[];g.state=null;}
function gOrder(){const g=S.game;
  if(g.i>=g.qs.length){const n=g.qs.length,p=g.score/n,rec=saveBest("order",g.score);$("#panel").innerHTML=gHead("Gapni tartibla")+endScreen(p===1?"Aʼlo!":"Barakalla!",g.score+" / "+n,"gap toʻgʻri tuzildi"+(rec?" · yangi rekord":""),p===1?3:p>=.6?2:1,g.wrong.length?'<div class="mist"><b>Toʻgʻri gaplar:</b>'+g.wrong.map(s=>'<div><span class="ar">'+s[0]+'</span><span>'+esc(s[1])+'</span></div>').join("")+'</div>':'');return;}
  const s=g.qs[g.i];
  $("#panel").innerHTML=gHead("Gapni tartibla",(g.i+1)+' / '+g.qs.length+' · '+g.score+' ✓')+'<div class="picq">'+
   '<div><div class="muted" style="font-size:14px">Shu gapni arabcha tuzing (oʻngdan chapga):</div><div style="font-size:20px;font-weight:800">'+esc(s[1])+'</div></div>'+
   '<div class="sentence'+(g.state==="ok"?' ok':g.state==="no"?' no shake':'')+'" aria-label="Siz tuzgan gap">'+(g.pick.length?g.pick.map((k,j)=>'<button class="wchip" data-un="'+j+'"'+(g.state?' disabled':'')+'>'+g.chips[k]+'</button>').join(""):'<span class="muted" style="direction:ltr;font-size:14px">Pastdagi soʻzlarni tartib bilan bosing</span>')+'</div>'+
   (g.state?'<div class="fb '+(g.state==="ok"?'good':'bad')+'">'+(g.state==="ok"?'Toʻgʻri!':'Toʻgʻrisi:')+'</div><div class="ar" style="text-align:center;font-size:24px">'+s[0]+'</div><button class="btn primary" data-act="ordnext">Keyingisi</button>':
   '<div class="pool">'+g.chips.map((c,k)=>'<button class="wchip" data-ch="'+k+'"'+(g.pick.includes(k)?' disabled':'')+'>'+c+'</button>').join("")+'</div><div class="row"><button class="btn ghost" data-act="ordclear">Tozalash</button><button class="btn primary" data-act="ordcheck"'+(g.pick.length===g.chips.length?'':' disabled')+'>Tekshirish</button></div>')+'</div>';}
function orderCheck(){const g=S.game,s=g.qs[g.i][0];const typed=g.pick.map(k=>g.chips[k]).join(" ");if(typed===s){g.state="ok";g.score++;}else{g.state="no";g.wrong.push(g.qs[g.i]);}gOrder();}

function startGame(t){stopTimer();({match:startMatch,pic:startPic,letters:startLetters,speed:startSpeed,order:startOrder,bubble:startBubble,million:startMillion})[t]();}

/* Pufakchalar */
function startBubble(){S.game={type:"bubble",phase:"ready",score:0,lives:3,round:0,cur:null,wrong:[]};}
function newBubbleRound(){const g=S.game,pool=itemsOf(U());const it=pool[Math.floor(Math.random()*pool.length)];
  const opts=shuffle([it,...shuffle(pool.filter(x=>x.ar!==it.ar&&x.uz!==it.uz)).slice(0,3)]);
  const dur=Math.max(3.6,7.5-g.score*0.25);g.round++;g.cur={it,opts,dur,delays:opts.map(()=>Math.random()*0.9),done:false};}
const BUB=["#34d399","#a78bfa","#38bdf8","#f472b6"];
function gBubble(){const g=S.game;
  if(g.phase==="ready"){const b=store.get("a1.best.bubble."+S.unit,null);$("#panel").innerHTML=gHead("Pufakchalar")+'<div class="result"><span class="emo" style="font-size:72px">🫧</span><p style="max-width:36ch;margin:0">Tepada oʻzbekcha soʻz chiqadi. Pastdan arabcha soʻzli pufakchalar uchib chiqadi: toʻgʻrisini qochib ketmasidan bosing! 3 ta jon bor, har toʻgʻri javobdan keyin pufakchalar tezlashadi.</p>'+(b!==null?'<p class="muted" style="margin:0">Rekordingiz: '+b+'</p>':'')+'<button class="btn primary" data-act="bubgo">Boshlash</button></div>';return;}
  if(g.phase==="end"){const rec=saveBest("bubble",g.score);$("#panel").innerHTML=gHead("Pufakchalar")+endScreen("Oʻyin tugadi!",g.score+" ball",(rec?"Yangi rekord!":"Yana urinib koʻring"),g.score>=15?3:g.score>=8?2:1,mist(g.wrong));return;}
  const c=g.cur;
  $("#panel").innerHTML=gHead("Pufakchalar",'<span aria-label="'+g.lives+' jon">'+"❤️".repeat(g.lives)+"🤍".repeat(3-g.lives)+'</span> · '+g.score)+
   '<div class="bubq"><span class="muted" style="font-size:13px;font-weight:700">Arabchasini ushlang:</span><b>'+esc(c.it.uz)+'</b></div>'+
   '<div class="sky" id="sky">'+c.opts.map((o,k)=>'<button class="bub" data-bub="'+k+'" style="left:'+(4+k*24)+'%;--d:'+c.dur+'s;--w:'+c.delays[k].toFixed(2)+'s;--bc:'+BUB[k]+'"><span class="ar">'+o.ar+'</span></button>').join("")+'</div>';}
function bubbleHit(k){const g=S.game,c=g.cur;if(!c||c.done)return;const o=c.opts[k];const el=document.querySelector('[data-bub="'+k+'"]');
  if(o.ar===c.it.ar){c.done=true;g.score++;if(el)el.classList.add("pop");setTimeout(()=>{if(S.game!==g)return;newBubbleRound();gBubble();},380);}
  else{if(el){el.classList.add("bad");el.disabled=true;}loseLife(false);}}
function loseLife(miss){const g=S.game,c=g.cur;g.lives--;if(!g.wrong.includes(c.it))g.wrong.push(c.it);
  if(g.lives<=0){c.done=true;g.phase="end";setTimeout(()=>{if(S.game===g)gBubble();},350);return;}
  if(miss){c.done=true;newBubbleRound();gBubble();}else{const st=document.getElementById("gstat");if(st)st.innerHTML='<span>'+"❤️".repeat(g.lives)+"🤍".repeat(3-g.lives)+'</span> · '+g.score;}}
document.addEventListener("animationend",e=>{const b=e.target.closest&&e.target.closest(".bub");if(!b||!S.game||S.game.type!=="bubble"||S.game.phase!=="run")return;
  const g=S.game,c=g.cur;if(c.done)return;if(c.opts[+b.dataset.bub].ar===c.it.ar)loseLife(true);});

/* Million soʻm */
const LADDER=[500,1000,2000,5000,10000,20000,50000,100000,200000,300000,500000,1000000];
const SAFE=[3,7];
const som=n=>n.toLocaleString("ru-RU").replace(/,/g," ")+" soʻm";
function startMillion(){const own=shuffle(itemsOf(U())),prev=shuffle(UNITS.slice(0,S.unit).flatMap(itemsOf));
  const pick=[];const seen=new Set();for(const x of own.concat(prev)){if(pick.length>=14)break;if(!seen.has(x.ar)){seen.add(x.ar);pick.push(x)}}
  S.game={type:"million",pool:pick,i:0,ans:null,fifty:true,skip:true,hidden:[],q:null,over:false};nextMillion();}
function nextMillion(){const g=S.game,it=g.pool.shift();const base=UNITS.slice(0,S.unit).flatMap(itemsOf);
  const hard=g.i>=6;const cand=base.filter(x=>x.ar!==it.ar&&x.uz!==it.uz&&(hard?x.u===it.u:true));
  g.q={it,dir:g.i%2?"uz":"ar",opts:shuffle([it,...shuffle(cand).slice(0,3)])};g.ans=null;g.hidden=[];}
function gMillion(){const g=S.game;
  if(g.over){const won=g.i>=LADDER.length,safe=won?LADDER[11]:(SAFE.filter(x=>x<g.i).map(x=>LADDER[x]).pop()||0);
    $("#panel").innerHTML=gHead("Million soʻm")+endScreen(won?"Siz millioner boʻldingiz! 🎉":"Oʻyin tugadi",som(safe),won?"Barcha 12 savolga toʻgʻri javob berdingiz":(g.i+" ta savolga toʻgʻri javob"),won?3:g.i>=8?2:1);if(won)saveBest("million",12);else saveBest("million",g.i);return;}
  const q=g.q;
  const ladder='<div class="ladder">'+LADDER.map((v,k)=>'<span class="'+(k===g.i?'now':k<g.i?'past':'')+(SAFE.includes(k)?' safe':'')+'">'+(v>=1000000?'1 mln':v>=1000?(v/1000)+'k':v)+'</span>').join("")+'</div>';
  const head=q.dir==="ar"?'<div class="prompt">'+(g.i+1)+'-savol · '+som(LADDER[g.i])+'</div><div class="qbig ar">'+q.it.ar+'</div><div class="muted" style="text-align:center;margin-top:-8px;margin-bottom:10px">Bu soʻzning tarjimasi qaysi?</div>':'<div class="prompt">'+(g.i+1)+'-savol · '+som(LADDER[g.i])+'</div><div class="quz">«'+esc(q.it.uz)+'» arabchada qanday?</div>';
  $("#panel").innerHTML=gHead("Million soʻm",som(g.i?LADDER[g.i-1]:0))+ladder+'<div class="q mil">'+head+'<div class="opts">'+
   q.opts.map((o,k)=>{if(g.hidden.includes(k))return '<button class="opt" disabled style="visibility:hidden">·</button>';let cl="";if(g.ans!==null){if(o.ar===q.it.ar)cl=" ok";else if(k===g.ans)cl=" no";}
     return '<button class="opt'+(q.dir==="uz"?' ar':'')+cl+'" data-mil="'+k+'"'+(g.ans!==null?' disabled':'')+'><span class="lt">'+"ABCD"[k]+'</span> '+(q.dir==="ar"?esc(o.uz):o.ar)+'</button>';}).join("")+'</div>'+
   '<div class="qfoot">'+(g.ans===null?'<div class="row" style="justify-content:flex-start"><button class="btn ghost" data-act="fifty"'+(g.fifty?'':' disabled')+'>50 : 50</button><button class="btn ghost" data-act="milskip"'+(g.skip?'':' disabled')+'>Almashtirish</button></div>':
     (q.opts[g.ans].ar===q.it.ar?'<span class="fb good">Toʻgʻri! +'+som(LADDER[g.i])+'</span><button class="btn primary" data-act="milnext">'+(g.i===11?'Yakunlash':'Keyingi savol')+'</button>':'<span class="fb bad">Afsus, notoʻgʻri</span><button class="btn primary" data-act="milend">Natija</button>'))+'</div></div>';}


/* ---------------- vocab test ---------------- */
let qz=null,qScope="unit";
function newQuiz(){const pool=qScope==="unit"?itemsOf(U()):UNITS.slice(0,S.unit).flatMap(itemsOf);
  const qs=shuffle(pool).slice(0,Math.min(10,pool.length)).map(it=>({it,dir:Math.random()<.5?"ar":"uz",opts:shuffle([it,...shuffle(pool.filter(x=>x.ar!==it.ar&&x.uz!==it.uz)).slice(0,3)])}));
  qz={qs,i:0,score:0,ans:null,wrong:[],unit:S.unit,scope:qScope};}
function renderTest(){
  if(!qz||qz.unit!==S.unit||qz.scope!==qScope)newQuiz();
  const tools='<div class="tools"><select id="scope" aria-label="Test qamrovi"><option value="unit"'+(qScope==="unit"?' selected':'')+'>Faqat shu boʻlim</option><option value="upto"'+(qScope==="upto"?' selected':'')+'>1–'+S.unit+'-boʻlimlar aralash</option></select><button class="btn ghost" data-act="newquiz">Yangi test</button></div>';
  if(qz.i>=qz.qs.length){const n=qz.qs.length,p=qz.score/n;if(!qz.sent){qz.sent=true;const T=store.get("a1.tests",{});T[S.unit]=Math.max(T[S.unit]||0,Math.round(p*100));store.set("a1.tests",T);logAct(5);report("test",U().uz,qz.score,n,true);}$("#panel").innerHTML=tools+'<div class="result">'+stars(p>=.9?3:p>=.7?2:1)+'<div class="big">'+qz.score+' / '+n+'</div><p style="margin:0">'+(p>=.9?"Aʼlo! Bu boʻlim soʻzlarini yaxshi bilasiz.":p>=.7?"Yaxshi natija. Xatolaringizni kartochkalarda takrorlang.":"Soʻzlarni kartochkalarda yana takrorlab, testni qayta ishlang.")+'</p>'+mist(qz.wrong)+'<button class="btn primary" data-act="newquiz">Yana test ishlash</button></div>';bindScope();return;}
  const q=qz.qs[qz.i];
  const head=q.dir==="ar"?'<div class="prompt">Tarjimasini tanlang</div><div class="qbig ar">'+q.it.ar+'</div>':'<div class="prompt">Arabchasini tanlang</div><div class="quz">'+esc(q.it.uz)+'</div>';
  $("#panel").innerHTML=tools+'<div class="progress"><div class="bar"><i style="width:'+(qz.i/qz.qs.length*100)+'%"></i></div><span>'+(qz.i+1)+'/'+qz.qs.length+'</span></div><div class="q">'+head+'<div class="opts">'+
   q.opts.map((o,k)=>{let cl="";if(qz.ans!==null){if(o.ar===q.it.ar)cl=" ok";else if(k===qz.ans)cl=" no";}return '<button class="opt'+(q.dir==="uz"?' ar':'')+cl+'" data-q="'+k+'"'+(qz.ans!==null?' disabled':'')+'>'+(q.dir==="ar"?esc(o.uz):o.ar)+'</button>';}).join("")+'</div>'+
   '<div class="qfoot"><span class="stat">Toʻgʻri: '+qz.score+'</span>'+(qz.ans!==null?'<button class="btn primary" data-act="qnext">Keyingisi</button>':'')+'</div></div>';
  bindScope();}
document.addEventListener("submit",e=>{if(e.target.id==="nameform"){e.preventDefault();const v=($("#nmin").value||"").trim();if(v.length<2)return;store.set("a1.name",v);report("roʻyxatdan oʻtdi","",null,null,true);render();}});
function bindScope(){const s=$("#scope");if(s)s.onchange=e=>{qScope=e.target.value;newQuiz();renderTest();};}

/* ---------------- rules ---------------- */
function fmtQ(s){return String(s).replace(/([؀-ۿ][؀-ۿً-ْ\s…؟،.]*[؀-ۿً-ْ؟])/g,'<span class="ar">$1</span>');}
function renderRules(){const rs=RULES[S.unit];
  $("#panel").innerHTML=rs.map((r,ri)=>'<section class="rule"><div class="rule-h"><h3>'+r.t+'</h3><span class="ar">'+r.ar+'</span></div>'+r.html+
   '<div class="mini"><h4>Oʻzingizni tekshiring</h4>'+r.quiz.map((q,qi)=>'<div class="mq" data-r="'+ri+'" data-qq="'+qi+'"><div class="qt">'+(qi+1)+'. '+fmtQ(q[0])+'</div><div class="opts">'+
   q[1].map((o,oi)=>'<button class="opt'+(/[؀-ۿ]/.test(o)?' ar':'')+'" data-o="'+oi+'">'+o+'</button>').join("")+'</div><div class="why" hidden></div></div>').join("")+'</div></section>').join("");}

/* ---------------- events ---------------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.say!==undefined){say(d.say);return;}
  if(d.unit){stopTimer();S={view:"unit",unit:+d.unit,tab:"words",game:null};qz=null;render();window.scrollTo(0,0);return;}
  if(d.tab){stopTimer();S.tab=d.tab;S.game=null;render();window.scrollTo(0,0);return;}
  if(d.game){startGame(d.game);renderGames();return;}
  if(d.m!==undefined){matchClick(+d.m);return;}
  if(d.pic!==undefined){const g=S.game;if(g.ans!==null)return;g.ans=+d.pic;const q=g.qs[g.i];if(q.opts[g.ans].ar===q.it.ar)g.score++;else g.wrong.push(q.it);gPic();return;}
  if(d.tile!==undefined){letterTap(+d.tile);return;}
  if(d.slot!==undefined){const g=S.game;if(g.state)return;g.pick=g.pick.slice(0,+d.slot);gLetters();return;}
  if(d.tf!==undefined){speedAns(+d.tf);return;}
  if(d.bub!==undefined){bubbleHit(+d.bub);return;}
  if(d.mil!==undefined){const g=S.game;if(g.ans!==null)return;g.ans=+d.mil;gMillion();return;}
  if(d.ch!==undefined){const g=S.game;if(!g.state&&!g.pick.includes(+d.ch)){g.pick.push(+d.ch);gOrder();}return;}
  if(d.un!==undefined){const g=S.game;if(!g.state){g.pick.splice(+d.un,1);gOrder();}return;}
  if(d.q!==undefined){if(qz.ans!==null)return;qz.ans=+d.q;const q=qz.qs[qz.i];if(q.opts[qz.ans].ar===q.it.ar)qz.score++;else qz.wrong.push(q.it);renderTest();return;}
  if(d.o!==undefined){const box=t.closest(".mq"),q=RULES[S.unit][+box.dataset.r].quiz[+box.dataset.qq],oi=+d.o;
    box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.o===q[2])x.classList.add("ok");});if(oi!==q[2])t.classList.add("no");
    const w=box.querySelector(".why");w.hidden=false;w.innerHTML=(oi===q[2]?"Toʻgʻri. ":"Toʻgʻri javob boshqa. ")+fmtQ(q[3]);return;}
  switch(d.act){
    case "home":stopTimer();S={view:"home",unit:S.unit,tab:"words",game:null};render();break;
    case "hideuz":hideUz=!hideUz;renderWords();break;
    case "fchint":fc.hint++;renderCards();break;
    case "fcshow":fc.state="show";renderCards();break;
    case "fcnext":fcNext(false);break;
    case "onlynew":fc.onlyNew=!fc.onlyNew;buildDeck();renderCards();break;
    
    case "resetknown":store.set("a1.known."+S.unit,{});fc.onlyNew=false;buildDeck();renderCards();break;
    case "gamesmenu":stopTimer();S.game=null;renderGames();break;
    case "replay":startGame(S.game.type);renderGames();break;
    case "picnext":S.game.i++;S.game.ans=null;gPic();break;
    case "letnext":S.game.i++;prepLetters();gLetters();break;
    case "letundo":S.game.pick.pop();gLetters();break;
    case "letskip":S.game.state="no";S.game.wrong.push(S.game.qs[S.game.i]);gLetters();break;
    case "speedgo":speedGo();break;
    case "bubgo":S.game.phase="run";newBubbleRound();gBubble();break;
    case "fifty":{const g=S.game;if(!g.fifty)break;g.fifty=false;const wrong=g.q.opts.map((o,k)=>k).filter(k=>g.q.opts[k].ar!==g.q.it.ar);g.hidden=shuffle(wrong).slice(0,2);gMillion();break;}
    case "milskip":{const g=S.game;if(!g.skip||!g.pool.length)break;g.skip=false;nextMillion();gMillion();break;}
    case "milnext":{const g=S.game;g.i++;if(g.i>=LADDER.length||!g.pool.length){g.i=Math.min(g.i,LADDER.length);g.over=true;}else nextMillion();gMillion();break;}
    case "milend":S.game.over=true;gMillion();break;
    case "ordnext":S.game.i++;prepOrder();gOrder();break;
    case "ordclear":S.game.pick=[];gOrder();break;
    case "ordcheck":orderCheck();break;
    case "newquiz":newQuiz();renderTest();break;
    case "qnext":qz.i++;qz.ans=null;renderTest();break;
  }
});
render();
</script>
